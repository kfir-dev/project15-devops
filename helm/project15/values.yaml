app:
  image:
    repository: project15-app
    tag: local
    pullPolicy: Never
  service:
    type: NodePort
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  image: postgres:15.19-bookworm
  name: project15
  user: project15
  password: ""
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: project15.local
