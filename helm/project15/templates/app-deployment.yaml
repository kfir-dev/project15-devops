apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
    spec:
      automountServiceAccountToken: false
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: wait-for-database
          image: {{ .Values.database.image | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h {{ .Release.Name }}-database -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                sleep 2
              done
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-app
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-app
                  key: POSTGRES_USER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
{{ toYaml .Values.database.resources | indent 12 }}
      containers:
        - name: app
          {{- if .Values.app.image.digest }}
          image: "{{ .Values.app.image.repository }}@{{ .Values.app.image.digest }}"
          {{- else }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SECURITY_REPORTS_DIR
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-app
                  key: SECURITY_REPORTS_DIR
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
{{ toYaml .Values.app.resources | indent 12 }}
          volumeMounts:
            - name: database-secret
              mountPath: /var/run/secrets/project15
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: security-reports
              mountPath: /app/security-reports
              readOnly: true
      volumes:
        - name: database-secret
          secret:
            secretName: {{ default (printf "%s-database" .Release.Name) .Values.database.existingSecret }}
            items:
              - key: DATABASE_URL
                path: DATABASE_URL
        - name: tmp
          emptyDir:
            medium: Memory
        - name: security-reports
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-security-reports
