apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-database
  namespace: {{ .Release.Namespace }}
  annotations:
    checkov.io/skip1: "CKV_K8S_40=Keep PostgreSQL UID/GID 999 to preserve existing PVC ownership; see docs/checkov-exceptions.md"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-database
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-database
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: {{ .Values.database.image | quote }}
          imagePullPolicy: {{ .Values.database.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-app
          env:
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/secrets/project15/POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
{{ toYaml .Values.database.resources | indent 12 }}
          volumeMounts:
            - name: postgres-run
              mountPath: /run/postgresql
            - name: postgres-tmp
              mountPath: /tmp
            - name: database-secret
              mountPath: /var/run/secrets/project15
              readOnly: true
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-run
          emptyDir:
            medium: Memory
        - name: postgres-tmp
          emptyDir:
            medium: Memory
        - name: database-secret
          secret:
            secretName: {{ default (printf "%s-database" .Release.Name) .Values.database.existingSecret }}
            items:
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-database
