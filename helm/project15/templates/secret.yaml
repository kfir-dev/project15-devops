{{- if not .Values.database.existingSecret }}
{{- $password := required "Set database.password with --set-file; never commit it to values.yaml" .Values.database.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-database:5432/%s" .Values.database.user ($password | urlquery) .Release.Name .Values.database.name | b64enc | quote }}
{{- end }}
