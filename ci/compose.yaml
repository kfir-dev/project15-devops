name: project15-ci

services:
  jenkins:
    image: ${JENKINS_IMAGE:?Pinned Jenkins image required}
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1024m"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  sonar-db:
    image: ${POSTGRES_IMAGE:?Pinned PostgreSQL image required}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
    entrypoint: ["/bin/bash", "/opt/project15/postgres-entrypoint.sh"]
    command: ["postgres"]
    secrets:
      - sonar_db_password
    volumes:
      - sonar_db:/var/lib/postgresql/data
      - ./postgres-entrypoint.sh:/opt/project15/postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  sonarqube:
    image: ${SONARQUBE_IMAGE:?Pinned SonarQube image required}
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
    entrypoint: ["/bin/bash", "/opt/project15/sonarqube-entrypoint.sh"]
    secrets:
      - sonar_db_password
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
      - sonar_temp:/opt/sonarqube/temp
      - ./sonarqube-entrypoint.sh:/opt/project15/sonarqube-entrypoint.sh:ro
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:9000/api/system/status |
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

secrets:
  sonar_db_password:
    file: ${HOME}/.config/project15-ci/secrets/sonar-db-password

volumes:
  jenkins_home:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_temp:
