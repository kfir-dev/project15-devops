apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project15-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:kfir-dev/project15-devops.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
