apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project15-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:kfir-dev/project15-devops.git
    targetRevision: main
    path: helm/project15
    helm:
      releaseName: project15-gitops
      valuesObject:
        app:
          image:
            repository: project15-app
            tag: db-recovery-v0.9.0
            pullPolicy: Never
          service:
            type: ClusterIP
        database:
          existingSecret: project15-gitops-database
        ingress:
          host: project15-gitops.local
  destination:
    server: https://kubernetes.default.svc
    namespace: project15-gitops
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
